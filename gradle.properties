org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# [Eksperimen percepatan kompilasi, 2026-08-21] CI (`build.yml`) menjalankan
# 3 invocation `./gradlew` TERPISAH dalam 1 job yang sama (compileDebugKotlin
# -> testDebugUnitTest+testReleaseUnitTest -> assembleRelease) -- flag di
# bawah utamanya menghemat waktu KONFIGURASI ulang project berkali-kali di
# job yang sama + build/module cache lintas run (`gradle/actions/setup-gradle
# @v3` di CI sudah cache `~/.gradle` antar run workflow secara bawaan).
org.gradle.parallel=true
org.gradle.caching=true
# EKSPERIMENTAL (fitur Gradle, bukan cuma proyek ini) -- AGP 8.5.2 +
# Gradle 8.9 (pinned di CI) sudah cukup matang utk ini, TAPI
# `signingConfigs` di app/build.gradle.kts baca `System.getenv(...)`
# LANGSUNG saat fase konfigurasi (input "untracked" bagi configuration
# cache). `problems=warn` (bukan default `fail`) supaya itu cuma jadi
# WARNING dan build tetap lanjut normal -- bukan gagal keras cuma gara2
# adopsi eksperimental ini. Kalau ternyata masih bermasalah di CI, cara
# rollback: hapus 2 baris `org.gradle.configuration-cache*` di bawah ini
# saja (3 baris lain di atas aman/stabil, TIDAK perlu ikut dirollback).
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true
