name: Build PromptVault APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # [fix 2026-08-18] Stale Run Guard (Anti-Desync): kejadian nyata --
      # re-run job LAMA (commit v8.2.0) sempat jalan SETELAH v8.3.0/v8.4.0
      # sudah dipublish. softprops/action-gh-release default nge-tandain
      # release yang baru dipublish sebagai "Latest", walau versinya lebih
      # rendah -- sidebar repo jadi nunjuk APK usang. Bandingkan SHA commit
      # yang sedang di-build dengan tip `main` SAAT INI di remote; kalau beda
      # (stale re-run / re-run manual dari commit lama), batalkan sebelum
      # buang waktu compile & sebelum publish release usang.
      - name: Stale run guard (anti-desync)
        run: |
          set -euo pipefail
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "Commit yang di-build : $GITHUB_SHA"
          echo "Tip main saat ini    : $REMOTE_SHA"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Stale re-run terdeteksi -- commit ini bukan tip main terbaru. Dibatalkan supaya tidak publish APK usang / menimpa flag 'Latest' release yang lebih baru."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # PENTING: runner GitHub Actions kadang sudah menyediakan Gradle versi
      # sangat baru (pernah ketemu 9.6.1) yang TIDAK KOMPATIBEL dengan AGP
      # 8.5.2 yang dipakai project ini. Kunci ke versi yang teruji cocok.
      - name: Generate pinned Gradle Wrapper (8.9)
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      # set -euo pipefail WAJIB di setiap step yang pakai "| tee": tanpa ini,
      # exit code pipeline ikut "tee" (yang selalu sukses), bukan ikut
      # gradlew -- akibatnya step gagal bisa dianggap SUKSES oleh Actions dan
      # workflow lanjut ke step berikutnya seolah semua baik-baik saja. Ini
      # PERSIS penyebab kegagalan "cp: cannot stat app-release.apk" yang
      # pernah kejadian: assembleRelease sebenarnya gagal duluan, tapi
      # step-nya dianggap sukses karena exit code ke-mask oleh tee.
      - name: Decode keystore
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          # Verifikasi keystore benar-benar valid & tidak kosong -- kalau secret
          # kosong/salah, deteksi di sini dengan pesan jelas, bukan gagal
          # samar-samar belakangan di tengah proses signing.
          if [ ! -s "$GITHUB_WORKSPACE/release.keystore" ]; then
            echo "::error::release.keystore kosong/gagal didekode. Cek secret ANDROID_KEYSTORE_BASE64 di GitHub."
            exit 1
          fi
          keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null || {
            echo "::error::release.keystore tidak valid atau ANDROID_KEYSTORE_PASSWORD salah."
            exit 1
          }
          echo "Keystore valid."

      # [Eksperimen percepatan kompilasi batch 2, 2026-08-21] SEBELUMNYA 3
      # invocation `./gradlew` TERPISAH (compileDebugKotlin -> testDebugUnitTest
      # +testReleaseUnitTest -> assembleRelease) = project dikonfigurasi ulang
      # tiap invocation (`configuration-cache` di-key per SET task yang
      # diminta -- config utk "compileDebugKotlin" saja TIDAK otomatis kepake
      # ulang utk request "assembleRelease" yang beda set task, lihat
      # PROJECT_STATE.md v8.13.0). Digabung jadi SATU invocation dgn ke-4
      # task sekaligus supaya project betul2 CUMA dikonfigurasi SEKALI.
      # Keystore WAJIB sudah didekode SEBELUM step ini (dipindah ke atas)
      # krn `assembleRelease` butuh file+env signing sejak awal invocation.
      # Gradle TETAP fail-fast: tanpa `--continue`, begitu 1 task gagal,
      # build berhenti & task berikutnya (mis. `assembleRelease`) TIDAK
      # dijalankan -- perilaku setara 3 step terpisah lama, cuma log
      # digabung jadi 1 file (`build-all.log`, lihat step upload log gagal
      # di bawah yang juga sudah disesuaikan).
      - name: Compile, test, and build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew compileDebugKotlin testDebugUnitTest testReleaseUnitTest assembleRelease --stacktrace 2>&1 | tee build-all.log

      # Diagnostik SELALU jalan (bukan cuma pas gagal) supaya kalau nama file
      # output ternyata beda dugaan (mis. "app-release-unsigned.apk" karena
      # signing tidak terpasang), langsung kelihatan di log -- bukan berhenti
      # di error cp yang tidak jelas asal-usulnya.
      - name: List release output (diagnostic)
        if: always()
        run: |
          echo "Isi app/build/outputs/apk/release/:"
          ls -la app/build/outputs/apk/release/ 2>&1 || echo "(folder tidak ada -- assembleRelease kemungkinan gagal sebelum menghasilkan APK apapun)"

      # Cari APK yang benar-benar dihasilkan secara dinamis (bukan hardcode
      # nama file), supaya baik APK signed ("app-release.apk") maupun kasus
      # tak terduga tetap ketemu & tidak diam-diam gagal di sini.
      - name: Rename APK with version name
        run: |
          set -euo pipefail
          mkdir -p out
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Tidak ada file .apk ditemukan di app/build/outputs/apk/release/. Lihat log 'assemble-release.log' dan step diagnostik di atas."
            exit 1
          fi
          if [[ "$APK_PATH" == *"unsigned"* ]]; then
            echo "::warning::APK yang ditemukan TIDAK BERTANDA TANGAN ($APK_PATH) -- signingConfig kemungkinan tidak terpasang. Cek GitHub Secrets ANDROID_KEYSTORE_*."
          fi
          cp "$APK_PATH" "out/PromptVault-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptVault-v${{ steps.version.outputs.version }}
          path: out/*.apk

      # [fix 2026-08-04] SEBELUMNYA APK cuma jadi Actions Artifact (butuh
      # login GitHub + expired 90 hari, tidak terlihat di sidebar Releases
      # repo). Sesuai aturan proyek, APK signed WAJIB muncul di GitHub
      # Release supaya bisa diunduh langsung tanpa dibungkus .zip dan tanpa
      # login. Tag dibuat otomatis dari versionName -- kalau tag sama sudah
      # ada (re-run versi yang sama), action ini UPDATE release yang sama
      # (bukan gagal/duplikat).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PromptVault v${{ steps.version.outputs.version }}
          files: out/*.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # [fix 2026-08-18b] Gejala nyata: Releases page nunjuk versi lama walau
      # build baru SUKSES hijau. Sebab: kalau tag sudah pernah ada (re-run /
      # versionName sempat tidak naik), action di atas UPDATE release lama,
      # bukan create baru -- flag "Latest" GitHub kadang tidak ikut pindah
      # karena diurut dari created_at, bukan dari nomor versi. Paksa ulang di
      # sini pakai gh CLI supaya release versi ini SELALU jadi "Latest",
      # terlepas dari kapan dia dibuat/di-update.
      - name: Force-flag this release as Latest (anti-stuck)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "v${{ steps.version.outputs.version }}" --latest --repo "${{ github.repository }}"
          echo "Latest release dipaksa ke v${{ steps.version.outputs.version }}"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log-v${{ steps.version.outputs.version }}
          path: |
            build-all.log
            **/build/reports/**
          if-no-files-found: ignore

      - name: Clean up keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"
