name: Build PromptVault APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # PENTING: runner GitHub Actions kadang sudah menyediakan Gradle versi
      # sangat baru (pernah ketemu 9.6.1) yang TIDAK KOMPATIBEL dengan AGP
      # 8.5.2 yang dipakai project ini (AGP 8.5.x resmi didukung sampai
      # sekitar Gradle 8.7-8.9). Ini pernah jadi penyebab build gagal tanpa
      # pesan error yang jelas ke user. Solusinya: generate Gradle Wrapper
      # dengan versi yang DIKUNCI secara eksplisit, dan semua langkah
      # setelah ini pakai ./gradlew (bukan "gradle" polos dari runner).
      - name: Generate pinned Gradle Wrapper (8.9)
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      # Fail cepat & murah: cek kompilasi Kotlin dulu SEBELUM assembleRelease.
      # Output digabung ke file log via tee, supaya kalau gagal, isi errornya
      # (baris "e: file:///...") betulan ke-capture -- bukan cuma laporan
      # deprecation warning yang tidak menjelaskan apa-apa.
      - name: Compile check (fail fast)
        run: ./gradlew compileDebugKotlin --stacktrace 2>&1 | tee compile-check.log

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest testReleaseUnitTest --stacktrace 2>&1 | tee unit-tests.log

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/release.keystore

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace 2>&1 | tee assemble-release.log

      # Nama file APK & nama artifact GitHub SELALU mengikuti versionName di
      # app/build.gradle.kts secara otomatis -- tidak ada angka manual, tidak
      # ada commit hash/run id ditempel ke nama file.
      - name: Rename APK with version name
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PromptVault-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptVault-v${{ steps.version.outputs.version }}
          path: out/*.apk

      # Kalau ada langkah manapun di atas gagal, log KONSOL ASLI (bukan cuma
      # laporan deprecation) otomatis jadi artifact yang bisa diunduh dari
      # tab Actions. Baris yang diawali "e: file:///..." di compile-check.log
      # adalah bagian paling penting -- itu lokasi persis error-nya.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log-v${{ steps.version.outputs.version }}
          path: |
            compile-check.log
            unit-tests.log
            assemble-release.log
            **/build/reports/**
          if-no-files-found: ignore

      - name: Clean up keystore
        if: always()
        run: rm -f $GITHUB_WORKSPACE/release.keystore
