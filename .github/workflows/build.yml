name: Build PromptVault APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # PENTING: runner GitHub Actions kadang sudah menyediakan Gradle versi
      # sangat baru (pernah ketemu 9.6.1) yang TIDAK KOMPATIBEL dengan AGP
      # 8.5.2 yang dipakai project ini. Kunci ke versi yang teruji cocok.
      - name: Generate pinned Gradle Wrapper (8.9)
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      # set -euo pipefail WAJIB di setiap step yang pakai "| tee": tanpa ini,
      # exit code pipeline ikut "tee" (yang selalu sukses), bukan ikut
      # gradlew -- akibatnya step gagal bisa dianggap SUKSES oleh Actions dan
      # workflow lanjut ke step berikutnya seolah semua baik-baik saja. Ini
      # PERSIS penyebab kegagalan "cp: cannot stat app-release.apk" yang
      # pernah kejadian: assembleRelease sebenarnya gagal duluan, tapi
      # step-nya dianggap sukses karena exit code ke-mask oleh tee.
      - name: Compile check (fail fast)
        run: |
          set -euo pipefail
          ./gradlew compileDebugKotlin --stacktrace 2>&1 | tee compile-check.log

      - name: Run unit tests
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest testReleaseUnitTest --stacktrace 2>&1 | tee unit-tests.log

      - name: Decode keystore
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          # Verifikasi keystore benar-benar valid & tidak kosong -- kalau secret
          # kosong/salah, deteksi di sini dengan pesan jelas, bukan gagal
          # samar-samar belakangan di tengah proses signing.
          if [ ! -s "$GITHUB_WORKSPACE/release.keystore" ]; then
            echo "::error::release.keystore kosong/gagal didekode. Cek secret ANDROID_KEYSTORE_BASE64 di GitHub."
            exit 1
          fi
          keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null || {
            echo "::error::release.keystore tidak valid atau ANDROID_KEYSTORE_PASSWORD salah."
            exit 1
          }
          echo "Keystore valid."

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee assemble-release.log

      # Diagnostik SELALU jalan (bukan cuma pas gagal) supaya kalau nama file
      # output ternyata beda dugaan (mis. "app-release-unsigned.apk" karena
      # signing tidak terpasang), langsung kelihatan di log -- bukan berhenti
      # di error cp yang tidak jelas asal-usulnya.
      - name: List release output (diagnostic)
        if: always()
        run: |
          echo "Isi app/build/outputs/apk/release/:"
          ls -la app/build/outputs/apk/release/ 2>&1 || echo "(folder tidak ada -- assembleRelease kemungkinan gagal sebelum menghasilkan APK apapun)"

      # Cari APK yang benar-benar dihasilkan secara dinamis (bukan hardcode
      # nama file), supaya baik APK signed ("app-release.apk") maupun kasus
      # tak terduga tetap ketemu & tidak diam-diam gagal di sini.
      - name: Rename APK with version name
        run: |
          set -euo pipefail
          mkdir -p out
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Tidak ada file .apk ditemukan di app/build/outputs/apk/release/. Lihat log 'assemble-release.log' dan step diagnostik di atas."
            exit 1
          fi
          if [[ "$APK_PATH" == *"unsigned"* ]]; then
            echo "::warning::APK yang ditemukan TIDAK BERTANDA TANGAN ($APK_PATH) -- signingConfig kemungkinan tidak terpasang. Cek GitHub Secrets ANDROID_KEYSTORE_*."
          fi
          cp "$APK_PATH" "out/PromptVault-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptVault-v${{ steps.version.outputs.version }}
          path: out/*.apk

      # [fix 2026-08-04] SEBELUMNYA APK cuma jadi Actions Artifact (butuh
      # login GitHub + expired 90 hari, tidak terlihat di sidebar Releases
      # repo). Sesuai aturan proyek, APK signed WAJIB muncul di GitHub
      # Release supaya bisa diunduh langsung tanpa dibungkus .zip dan tanpa
      # login. Tag dibuat otomatis dari versionName -- kalau tag sama sudah
      # ada (re-run versi yang sama), action ini UPDATE release yang sama
      # (bukan gagal/duplikat).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PromptVault v${{ steps.version.outputs.version }}
          files: out/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log-v${{ steps.version.outputs.version }}
          path: |
            compile-check.log
            unit-tests.log
            assemble-release.log
            **/build/reports/**
          if-no-files-found: ignore

      - name: Clean up keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"
