name: Build PromptVault APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # [fix 2026-08-18] Stale Run Guard (Anti-Desync): kejadian nyata --
      # re-run job LAMA (commit v8.2.0) sempat jalan SETELAH v8.3.0/v8.4.0
      # sudah dipublish. softprops/action-gh-release default nge-tandain
      # release yang baru dipublish sebagai "Latest", walau versinya lebih
      # rendah -- sidebar repo jadi nunjuk APK usang. Bandingkan SHA commit
      # yang sedang di-build dengan tip `main` SAAT INI di remote; kalau beda
      # (stale re-run / re-run manual dari commit lama), batalkan sebelum
      # buang waktu compile & sebelum publish release usang.
      # [fix diagnostik gap v8.22.18, 2026-08-22] Kegagalan build-failure-log-
      # v8.22.17 TIDAK punya build-all.log SAMA SEKALI, dan config-cache
      # report yang tersisa justru menunjukkan step "Generate pinned Gradle
      # Wrapper" SUKSES BERSIH (totalProblemCount=0, Gradle 8.9 benar
      # terpakai -- fix v8.22.17 soal versi Gradle TERBUKTI jalan). Artinya
      # kegagalan sesungguhnya ada di step SETELAHNYA ("Decode keystore")
      # yang output-nya SEBELUM INI tidak pernah direkam ke file apa pun.
      # Sekarang SEMUA step (bukan cuma "Compile, test, build") merekam
      # stdout+stderr sendiri ke file `.log`, dan step upload di bawah
      # ambil `*.log` (glob) -- kegagalan step manapun ke depan otomatis
      # punya log yang bisa dibaca.
      #
      # [fix race condition v8.22.19, 2026-08-22] Percobaan pertama (v8.22.18)
      # pakai `exec > >(tee file) 2>&1` -- TERBUKTI GAGAL: build-failure-log-
      # v8.22.18 tetap TIDAK ada decode-keystore.log walau step "Generate
      # wrapper" sebelumnya berhasil (generate-wrapper.log ADA). Root cause:
      # `exec > >(proc-sub)` menjalankan `tee` di SUBSHELL BACKGROUND lewat
      # process substitution -- kalau step exit CEPAT (mis. langsung `exit 1`
      # tak lama setelah baris exec), shell utama bisa berhenti SEBELUM
      # subshell tee sempat membuka/nulis file ke disk sama sekali (race
      # condition, bukan bug logic di dalam step). Diganti pola `{ block; }
      # 2>&1 | tee file` -- tee di sini FOREGROUND (anggota pipeline biasa,
      # BUKAN proc-sub async), shell WAJIB tunggu tee selesai sebelum
      # pipeline dianggap kelar -- PERSIS pola yang sudah TERBUKTI reliable
      # di step "Compile, test, and build" sejak awal (build-all.log SELALU
      # lengkap tiap kali step itu yang gagal, termasuk di v8.22.14).
      #
      # [reposisi v8.35.2, 2026-08-27] SEBELUMNYA guard ini step KE-2 (setelah
      # `Checkout`) -- padahal `git ls-remote` mengecek SHA remote lewat
      # jaringan, TIDAK butuh isi repo/checkout sama sekali. Guard cuma
      # numpang di remote `origin` yang baru ada SETELAH checkout, jadi
      # checkout (network+disk I/O) tetap kebuang percuma tiap stale re-run
      # SEBELUM guard sempat membatalkan. Dipindah jadi step PALING PERTAMA
      # (sebelum Checkout) -- URL remote publik ditulis eksplisit (autentikasi
      # `GITHUB_TOKEN` bawaan) menggantikan alias `origin` yang sebelumnya
      # bergantung pada checkout, logika perbandingan SHA-nya sendiri 100%
      # sama persis (tidak diubah).
      - name: Stale run guard (anti-desync)
        run: |
          set -euo pipefail
          {
            REMOTE_SHA=$(git ls-remote "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
            echo "Commit yang di-build : $GITHUB_SHA"
            echo "Tip main saat ini    : $REMOTE_SHA"
            if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Stale re-run terdeteksi -- commit ini bukan tip main terbaru. Dibatalkan supaya tidak publish APK usang / menimpa flag 'Latest' release yang lebih baru."
              exit 1
            fi
          } 2>&1 | tee stale-run-guard.log

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # [fix root cause CI merah v8.22.16, 2026-08-22] SEBELUMNYA step ini
      # tanpa `with:` -- setup-gradle cuma menyiapkan caching, TIDAK
      # menyediakan binary `gradle` sendiri, jadi step "Generate pinned
      # Gradle Wrapper" di bawah terpaksa pakai `gradle` AMBIEN bawaan image
      # runner (bukan yang dipin). Image runner ternyata sudah bergeser ke
      # Gradle 9.7.0 (terbukti dari configuration-cache-report.html di
      # artifact log gagal -- link dokumentasi deprecation mengarah ke
      # docs.gradle.org/9.7.0/...), lebih baru dari "9.6.1" yang diantisipasi
      # komentar lama di bawah -- TIDAK KOMPATIBEL dgn AGP 8.5.2, bikin step
      # wrapper-generation crash SEBELUM sempat menulis wrapper apa pun
      # (makanya artifact log gagal TIDAK ada build-all.log sama sekali --
      # gagalnya di sini, sebelum step compile/test/build yang bikin log itu
      # pernah jalan). `gradle-version: '8.9'` eksplisit di sini bikin
      # action ini SENDIRI yang provision binary 8.9 yang pasti kompatibel
      # (download resmi dari action, bukan bergantung image runner) --
      # menghilangkan sumber drift ini secara permanen, bukan cuma sekali.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          {
            VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee read-version.log

      # PENTING: runner GitHub Actions kadang sudah menyediakan Gradle versi
      # sangat baru yang TIDAK KOMPATIBEL dengan AGP 8.5.2 yang dipakai
      # project ini. [Update 2026-08-22] Jaminan UTAMA sekarang datang dari
      # `gradle-version: '8.9'` di step "Setup Gradle" di atas (provisioning
      # eksplisit, bukan bergantung image runner) -- step ini TETAP dipakai
      # supaya file wrapper (gradlew, gradle-wrapper.properties) benar2
      # tergenerate persis versi 8.9 utk dipakai step berikutnya.
      - name: Generate pinned Gradle Wrapper (8.9)
        run: |
          set -euo pipefail
          { gradle wrapper --gradle-version 8.9 --distribution-type bin; } 2>&1 | tee generate-wrapper.log

      # set -euo pipefail WAJIB di setiap step yang pakai "| tee": tanpa ini,
      # exit code pipeline ikut "tee" (yang selalu sukses), bukan ikut
      # gradlew -- akibatnya step gagal bisa dianggap SUKSES oleh Actions dan
      # workflow lanjut ke step berikutnya seolah semua baik-baik saja. Ini
      # PERSIS penyebab kegagalan "cp: cannot stat app-release.apk" yang
      # pernah kejadian: assembleRelease sebenarnya gagal duluan, tapi
      # step-nya dianggap sukses karena exit code ke-mask oleh tee.
      - name: Decode keystore
        run: |
          set -euo pipefail
          {
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            # Verifikasi keystore benar-benar valid & tidak kosong -- kalau secret
            # kosong/salah, deteksi di sini dengan pesan jelas, bukan gagal
            # samar-samar belakangan di tengah proses signing.
            if [ ! -s "$GITHUB_WORKSPACE/release.keystore" ]; then
              echo "::error::release.keystore kosong/gagal didekode. Cek secret ANDROID_KEYSTORE_BASE64 di GitHub."
              exit 1
            fi
            keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null || {
              echo "::error::release.keystore tidak valid atau ANDROID_KEYSTORE_PASSWORD salah."
              exit 1
            }
            echo "Keystore valid."
          } 2>&1 | tee decode-keystore.log

      # [Eksperimen percepatan kompilasi batch 2, 2026-08-21] SEBELUMNYA 3
      # invocation `./gradlew` TERPISAH (compileDebugKotlin -> testDebugUnitTest
      # +testReleaseUnitTest -> assembleRelease) = project dikonfigurasi ulang
      # tiap invocation (`configuration-cache` di-key per SET task yang
      # diminta -- config utk "compileDebugKotlin" saja TIDAK otomatis kepake
      # ulang utk request "assembleRelease" yang beda set task, lihat
      # PROJECT_STATE.md v8.13.0). Digabung jadi SATU invocation dgn ke-4
      # task sekaligus supaya project betul2 CUMA dikonfigurasi SEKALI.
      # Keystore WAJIB sudah didekode SEBELUM step ini (dipindah ke atas)
      # krn `assembleRelease` butuh file+env signing sejak awal invocation.
      # Gradle TETAP fail-fast: tanpa `--continue`, begitu 1 task gagal,
      # build berhenti & task berikutnya (mis. `assembleRelease`) TIDAK
      # dijalankan -- perilaku setara 3 step terpisah lama, cuma log
      # digabung jadi 1 file (`build-all.log`, lihat step upload log gagal
      # di bawah yang juga sudah disesuaikan).
      #
      # [fix OOM v8.22.15/v8.22.15b] SEBELUMNYA `testDebugUnitTest
      # testReleaseUnitTest` DUA-DUANYA dijalankan -- dgn `org.gradle.parallel
      # =true` (gradle.properties), Gradle boleh menjalankan keduanya
      # BERSAMAAN, masing2 spawn JVM Robolectric sendiri (berat) di atas
      # runner CI terbatas -> "Gradle Test Executor... exit value 10" (lihat
      # PROJECT_STATE.md v8.22.15). Project ini TIDAK punya test source set
      # per-buildType (`app/src/test/`, bukan `app/src/testDebug/` atau
      # `testRelease/`) -- testDebugUnitTest & testReleaseUnitTest menjalankan
      # KELAS TEST YANG SAMA PERSIS. Menjalankan cuma salah satu (debug) tidak
      # mengurangi cakupan test sama sekali, cuma menghilangkan duplikasi JVM
      # Robolectric yang jadi penyebab OOM.
      - name: Compile, test, and build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew compileDebugKotlin testDebugUnitTest assembleRelease --stacktrace 2>&1 | tee build-all.log

      # Diagnostik SELALU jalan (bukan cuma pas gagal) supaya kalau nama file
      # output ternyata beda dugaan (mis. "app-release-unsigned.apk" karena
      # signing tidak terpasang), langsung kelihatan di log -- bukan berhenti
      # di error cp yang tidak jelas asal-usulnya.
      - name: List release output (diagnostic)
        if: always()
        run: |
          echo "Isi app/build/outputs/apk/release/:"
          ls -la app/build/outputs/apk/release/ 2>&1 || echo "(folder tidak ada -- assembleRelease kemungkinan gagal sebelum menghasilkan APK apapun)"

      # Cari APK yang benar-benar dihasilkan secara dinamis (bukan hardcode
      # nama file), supaya baik APK signed ("app-release.apk") maupun kasus
      # tak terduga tetap ketemu & tidak diam-diam gagal di sini.
      - name: Rename APK with version name
        run: |
          set -euo pipefail
          mkdir -p out
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Tidak ada file .apk ditemukan di app/build/outputs/apk/release/. Lihat log 'assemble-release.log' dan step diagnostik di atas."
            exit 1
          fi
          if [[ "$APK_PATH" == *"unsigned"* ]]; then
            echo "::warning::APK yang ditemukan TIDAK BERTANDA TANGAN ($APK_PATH) -- signingConfig kemungkinan tidak terpasang. Cek GitHub Secrets ANDROID_KEYSTORE_*."
          fi
          cp "$APK_PATH" "out/PromptVault-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptVault-v${{ steps.version.outputs.version }}
          path: out/*.apk

      # [fix 2026-08-04] SEBELUMNYA APK cuma jadi Actions Artifact (butuh
      # login GitHub + expired 90 hari, tidak terlihat di sidebar Releases
      # repo). Sesuai aturan proyek, APK signed WAJIB muncul di GitHub
      # Release supaya bisa diunduh langsung tanpa dibungkus .zip dan tanpa
      # login. Tag dibuat otomatis dari versionName -- kalau tag sama sudah
      # ada (re-run versi yang sama), action ini UPDATE release yang sama
      # (bukan gagal/duplikat).
      # [fix 2026-08-22] Gejala nyata (screenshot user): dialog update
      # in-app cuma nampilin "**Full Changelog**: <link compare>" -- 0
      # info konkret perubahan apa. Root cause: `generate_release_notes:
      # true` bikin GitHub auto-generate notes dari daftar PR/commit; repo
      # ini push langsung ke main (bukan alur PR), jadi hasil auto-nya
      # SELALU kosong isi kecuali baris compare-link itu sendiri -- BUKAN
      # bug di sisi app (releaseNotes sudah dirender benar sejak
      # v8.22.1-an, cuma sumber datanya yang kosong). Fix: body Release
      # diisi manual dari section TERATAS `CHANGELOG.md` (1 section = 1
      # versi terbaru) via `awk`, bukan lagi auto-generate. Fallback pesan
      # generik kalau ekstraksi gagal (mis. format CHANGELOG berubah) --
      # tidak pernah biarkan body release kosong total.
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          mkdir -p out
          awk '/^## /{n++} n==1' CHANGELOG.md > out/release_notes.md
          if [ ! -s out/release_notes.md ]; then
            echo "::warning::Gagal ekstrak section CHANGELOG.md teratas -- pakai fallback generik."
            echo "Rilis v${{ steps.version.outputs.version }}. Lihat CHANGELOG.md di repo untuk detail lengkap." > out/release_notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PromptVault v${{ steps.version.outputs.version }}
          files: out/*.apk
          body_path: out/release_notes.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # [fix 2026-08-18b] Gejala nyata: Releases page nunjuk versi lama walau
      # build baru SUKSES hijau. Sebab: kalau tag sudah pernah ada (re-run /
      # versionName sempat tidak naik), action di atas UPDATE release lama,
      # bukan create baru -- flag "Latest" GitHub kadang tidak ikut pindah
      # karena diurut dari created_at, bukan dari nomor versi. Paksa ulang di
      # sini pakai gh CLI supaya release versi ini SELALU jadi "Latest",
      # terlepas dari kapan dia dibuat/di-update.
      - name: Force-flag this release as Latest (anti-stuck)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "v${{ steps.version.outputs.version }}" --latest --repo "${{ github.repository }}"
          echo "Latest release dipaksa ke v${{ steps.version.outputs.version }}"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log-v${{ steps.version.outputs.version }}
          path: |
            *.log
            **/build/reports/**
          if-no-files-found: ignore

      - name: Clean up keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"
